name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history for changelog/version detection

      # Packages the addon per .pkgmeta, uploads to CurseForge (project id
      # from the TOC X-Curse-Project-ID line), and attaches the zip to a
      # GitHub release. Skips CurseForge gracefully until the project id
      # and CF_API_KEY secret exist — see PUBLISHING.md.
      - uses: BigWigsMods/packager@v2
        env:
          CF_API_KEY: ${{ secrets.CF_API_KEY }}
          GITHUB_OAUTH: ${{ secrets.GITHUB_TOKEN }}
          # Optional: also publish to Wago by adding this secret
          # WAGO_API_KEY: ${{ secrets.WAGO_API_KEY }}
