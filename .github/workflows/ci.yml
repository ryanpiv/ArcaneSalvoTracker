name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    name: Luacheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: lunarmodules/luacheck@v1

  test:
    name: Busted (Lua 5.1)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # WoW embeds Lua 5.1, so run the suite on the same version
      - uses: leafo/gh-actions-lua@v10
        with:
          luaVersion: "5.1"
      - uses: leafo/gh-actions-luarocks@v4
      - name: Install busted
        run: luarocks install busted
      - name: Run tests
        run: busted --output=TAP
